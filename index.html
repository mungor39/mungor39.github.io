<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Юрий Михеев — ИИ для жизни и бизнеса</title>
<meta name="description" content="Юрий Михеев — эксперт по эффективному внедрению ИИ в жизни и бизнесе. Telegram: @goldmun">
<style>
  :root {
    --bg: #0a0a0a;
    --card: rgba(255,255,255,0.035);
    --border: rgba(255,255,255,0.08);
    --text: #f2f2f2;
    --muted: #9a9a9a;
    --c1: #f7c948;
    --c2: #ff7849;
    --c3: #ff4d8d;
    --tg: #29a9eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Фон: плавающие цветные пятна + сетка */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .blob {
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: .35;
    animation: float 18s ease-in-out infinite;
  }
  .blob.b1 { width: 420px; height: 420px; background: var(--c1); top: -120px; left: -100px; }
  .blob.b2 { width: 360px; height: 360px; background: var(--c2); bottom: -120px; right: -80px; animation-delay: -6s; }
  .blob.b3 { width: 280px; height: 280px; background: var(--c3); top: 45%; left: 55%; opacity: .18; animation-delay: -12s; }
  @keyframes float {
    0%,100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(40px,-30px) scale(1.08); }
    66% { transform: translate(-30px,30px) scale(.95); }
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
  }
  #spot {
    position: fixed; width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(247,201,72,.12), transparent 60%);
    transform: translate(-50%,-50%); pointer-events: none; z-index: 0;
    transition: opacity .3s; opacity: 0;
  }

  /* Карточка */
  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 520px;
    margin: auto;
    padding: 56px 40px 44px;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 28px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
    transform-style: preserve-3d;
    transition: transform .2s ease-out;
    animation: appear .9s cubic-bezier(.2,.8,.2,1) both;
  }
  .card::before {
    content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px;
    background: linear-gradient(135deg, rgba(247,201,72,.6), transparent 40%, transparent 60%, rgba(255,120,73,.5));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events: none;
  }
  @keyframes appear {
    from { opacity: 0; transform: translateY(30px) scale(.97); }
    to { opacity: 1; transform: none; }
  }

  /* Аватар с инициалами */
  .avatar {
    width: 104px; height: 104px; margin: 0 auto 28px;
    border-radius: 50%; position: relative;
    display: grid; place-items: center;
    font-size: 36px; font-weight: 800; letter-spacing: 1px;
    background: #111;
  }
  .avatar::before {
    content: ""; position: absolute; inset: -3px; border-radius: 50%; z-index: -1;
    background: conic-gradient(from 0deg, var(--c1), var(--c2), var(--c3), var(--c1));
    animation: spin 6s linear infinite;
  }
  .avatar::after {
    content: ""; position: absolute; inset: -14px; border-radius: 50%; z-index: -2;
    background: conic-gradient(from 0deg, var(--c1), var(--c2), var(--c3), var(--c1));
    filter: blur(22px); opacity: .5;
    animation: spin 6s linear infinite;
  }
  .avatar span {
    width: 100%; height: 100%; border-radius: 50%; background: #0d0d0d;
    display: grid; place-items: center;
    background-clip: padding-box;
  }
  .avatar b {
    background: linear-gradient(135deg, #fff, #ffe3a3);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted);
    padding: 6px 14px; border: 1px solid var(--border); border-radius: 999px;
    margin-bottom: 18px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 10px #3ddc84; animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* Имя с градиентным свечением */
  h1 {
    font-size: clamp(38px, 9vw, 58px);
    line-height: 1.05;
    font-weight: 900;
    letter-spacing: -1.5px;
    margin-bottom: 18px;
    position: relative;
  }
  h1 .name {
    display: block;
    background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3), var(--c1));
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 8s linear infinite;
    filter: drop-shadow(0 0 18px rgba(247,201,72,.55)) drop-shadow(0 0 40px rgba(255,120,73,.25));
  }
  @keyframes shine { to { background-position: 300% 0; } }

  .role {
    font-size: clamp(16px, 4vw, 18px);
    color: #cfcfcf; line-height: 1.55;
    max-width: 380px; margin: 0 auto 30px;
  }
  .role em { font-style: normal; color: #fff; font-weight: 600; }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 34px; }
  .tag {
    font-size: 13px; color: #bdbdbd; padding: 7px 14px;
    background: rgba(255,255,255,.04); border: 1px solid var(--border); border-radius: 999px;
    transition: border-color .3s, color .3s, transform .3s;
  }
  .tag:hover { border-color: rgba(247,201,72,.6); color: #fff; transform: translateY(-2px); }

  /* Кнопка «Написать мне» */
  .cta {
    position: relative; display: inline-flex; align-items: center; gap: 12px;
    padding: 18px 38px; border-radius: 999px;
    font-size: 17px; font-weight: 700; color: #1a1206; text-decoration: none;
    background: linear-gradient(90deg, var(--c1), var(--c2), var(--c1));
    background-size: 200% 100%;
    box-shadow: 0 10px 30px rgba(247,201,72,.45);
    overflow: hidden; isolation: isolate;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s, background-position .6s;
    animation: breathe 3s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
  }
  .cta::before {
    content: ""; position: absolute; top: 0; left: -75%; width: 50%; height: 100%; z-index: -1;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,.45), transparent);
    transform: skewX(-20deg);
    animation: sweep 3.5s ease-in-out infinite;
  }
  .cta svg { width: 20px; height: 20px; transition: transform .3s; }
  .cta:hover {
    transform: translateY(-3px) scale(1.04);
    background-position: 100% 0;
    box-shadow: 0 16px 44px rgba(255,120,73,.5), 0 0 0 6px rgba(247,201,72,.15);
  }
  .cta:hover svg { transform: translateX(4px) rotate(-12deg); }
  .cta:active { transform: scale(.97); }
  @keyframes breathe { 50% { box-shadow: 0 10px 40px rgba(255,120,73,.55); } }
  @keyframes sweep { 0% { left: -75%; } 60%,100% { left: 130%; } }
  .ripple {
    position: absolute; border-radius: 50%; background: rgba(255,255,255,.5);
    transform: scale(0); animation: ripple .6s ease-out forwards; pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(4); opacity: 0; } }

  /* Кнопка «Сохранить контакт» */
  .actions { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .save {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 13px 26px; border-radius: 999px; cursor: pointer;
    font: inherit; font-size: 15px; font-weight: 600; color: #f5e6c4;
    background: rgba(247,201,72,.06); border: 1px solid rgba(247,201,72,.35);
    transition: background .3s, border-color .3s, color .3s, transform .25s;
    -webkit-tap-highlight-color: transparent;
  }
  .save svg { width: 18px; height: 18px; transition: transform .35s; }
  .save:hover { background: rgba(247,201,72,.14); border-color: var(--c1); color: #fff; transform: translateY(-2px); }
  .save:hover svg { transform: translateY(2px); }
  .save.done { border-color: #3ddc84; color: #3ddc84; background: rgba(61,220,132,.08); }

  /* Звёзды */
  #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

  /* Соцсети */
  .divider {
    display: flex; align-items: center; gap: 14px; margin: 38px 0 22px;
    color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 2px;
  }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .socials { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .social {
    --clr: var(--c1);
    position: relative; width: 56px; height: 56px; border-radius: 18px;
    display: grid; place-items: center;
    color: #d8d8d8; text-decoration: none; cursor: pointer;
    background: rgba(255,255,255,.04); border: 1px solid var(--border);
    transition: transform .3s cubic-bezier(.2,.8,.2,1), color .3s, background .3s, border-color .3s, box-shadow .3s;
    font: inherit;
    -webkit-tap-highlight-color: transparent;
  }
  .social svg { width: 24px; height: 24px; transition: transform .3s; }
  .social:hover, .social:focus-visible {
    transform: translateY(-6px);
    color: #fff; background: var(--clr); border-color: var(--clr);
    box-shadow: 0 12px 30px -6px var(--clr), 0 0 24px -4px var(--clr);
    outline: none;
  }
  .social:hover svg { transform: scale(1.12) rotate(-6deg); }
  .social .tip {
    position: absolute; bottom: calc(100% + 12px); left: 50%;
    transform: translate(-50%, 6px); opacity: 0; pointer-events: none;
    white-space: nowrap; font-size: 12px; font-weight: 600; color: #fff;
    background: #1a1a1a; border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 8px;
    transition: opacity .25s, transform .25s;
  }
  .social:hover .tip, .social:focus-visible .tip { opacity: 1; transform: translate(-50%, 0); }
  .social.tg { --clr: var(--tg); }
  .social.copy { --clr: var(--c1); }
  .social.share { --clr: var(--c3); }

  .handle {
    margin-top: 18px; font-size: 14px; color: var(--muted);
  }
  .handle a { color: #fff; text-decoration: none; border-bottom: 1px dashed rgba(255,255,255,.3); transition: color .2s, border-color .2s; }
  .handle a:hover { color: var(--c2); border-color: var(--c2); }

  /* Тост */
  .toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 10;
    transform: translate(-50%, 120px);
    padding: 12px 20px; border-radius: 12px;
    background: #161616; border: 1px solid var(--border); color: #fff; font-size: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    transition: transform .4s cubic-bezier(.2,.8,.2,1);
    display: flex; align-items: center; gap: 10px;
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast svg { width: 18px; height: 18px; color: #3ddc84; }

  footer {
    margin-top: 34px; font-size: 12px; color: #555;
  }

  /* Телефоны */
  @media (max-width: 480px) {
    body { align-items: flex-start; padding-top: 32px; }
    .card { padding: 44px 22px 34px; border-radius: 24px; }
    .avatar { width: 88px; height: 88px; font-size: 30px; margin-bottom: 22px; }
    .actions { align-items: stretch; }
    .cta, .save { width: 100%; justify-content: center; }
    .cta { padding: 17px 24px; }
    .social { width: 52px; height: 52px; border-radius: 16px; }
    .blob.b1 { width: 280px; height: 280px; }
    .blob.b2 { width: 240px; height: 240px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="grid"></div>
</div>
<canvas id="stars" aria-hidden="true"></canvas>
<div id="spot" aria-hidden="true"></div>

<main class="card" id="card">
  <div class="avatar" aria-hidden="true"><span><b>ЮМ</b></span></div>

  <div class="badge"><span class="dot"></span>Открыт к проектам</div>

  <h1><span class="name">Юрий Михеев</span></h1>

  <p class="role">
    Эксперт по <em>эффективному внедрению ИИ</em> в&nbsp;жизни и&nbsp;бизнесе
  </p>

  <div class="tags">
    <span class="tag">AI-стратегия</span>
    <span class="tag">Автоматизация</span>
    <span class="tag">Нейросети для команды</span>
  </div>

  <div class="actions">
    <a class="cta" id="cta" href="https://t.me/goldmun" target="_blank" rel="noopener">
      Написать мне
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/>
      </svg>
    </a>
    <button class="save" id="saveBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="8" r="4"/><path d="M2 21c.7-3.6 3.5-6 7-6s6.3 2.4 7 6"/><path d="M19 8v6M16 11h6"/>
      </svg>
      <span>Сохранить в контакты</span>
    </button>
  </div>

  <div class="divider">Контакты</div>

  <div class="socials">
    <a class="social tg" href="https://t.me/goldmun" target="_blank" rel="noopener" aria-label="Telegram @goldmun">
      <span class="tip">Telegram</span>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M21.94 4.3a1.2 1.2 0 0 0-1.62-1.35L2.7 9.73c-1.02.4-1 1.86.04 2.22l4.37 1.5 1.7 5.36c.24.75 1.18.99 1.75.44l2.48-2.4 4.6 3.4c.68.5 1.65.13 1.83-.7L21.94 4.3zM9.6 13.8l8.3-6.3c.17-.13.37.1.22.25l-6.86 6.62a1.6 1.6 0 0 0-.46.92l-.35 2.6c-.03.22-.34.24-.4.03l-1-3.4a.67.67 0 0 1 .27-.72z"/>
      </svg>
    </a>
    <button class="social copy" id="copyBtn" type="button" aria-label="Скопировать @goldmun">
      <span class="tip">Скопировать ник</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
    </button>
    <button class="social share" id="shareBtn" type="button" aria-label="Поделиться визиткой">
      <span class="tip">Поделиться</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>
      </svg>
    </button>
  </div>

  <p class="handle">Telegram: <a href="https://t.me/goldmun" target="_blank" rel="noopener">@goldmun</a></p>

  <footer>© <span id="year"></span> Юрий Михеев</footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
  <span id="toastText"></span>
</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toastText');
  let toastTimer;
  function showToast(msg) {
    toastText.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      ta.remove();
    }
  }

  document.getElementById('copyBtn').addEventListener('click', async () => {
    await copyText('@goldmun');
    showToast('Ник @goldmun скопирован');
  });

  document.getElementById('shareBtn').addEventListener('click', async () => {
    const data = {
      title: 'Юрий Михеев',
      text: 'Юрий Михеев — эксперт по эффективному внедрению ИИ в жизни и бизнесе. Telegram: @goldmun',
      url: location.protocol.startsWith('http') ? location.href : 'https://t.me/goldmun'
    };
    if (navigator.share) {
      try { await navigator.share(data); } catch (_) {}
    } else {
      await copyText(data.url);
      showToast('Ссылка скопирована');
    }
  });

  // Сохранить контакт (vCard) — открывается в «Контактах» на телефоне и компьютере
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.addEventListener('click', () => {
    const vcard = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:Михеев;Юрий;;;',
      'FN:Юрий Михеев',
      'TITLE:Эксперт по эффективному внедрению ИИ в жизни и бизнесе',
      'URL;TYPE=Telegram:https://t.me/goldmun',
      'X-SOCIALPROFILE;TYPE=telegram:https://t.me/goldmun',
      'NOTE:Telegram: @goldmun',
      'END:VCARD'
    ].join('\r\n');
    const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'Yuriy-Mikheev.vcf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    saveBtn.classList.add('done');
    saveBtn.querySelector('span').textContent = 'Контакт сохранён';
    showToast('Откройте файл, чтобы добавить контакт');
    setTimeout(() => {
      saveBtn.classList.remove('done');
      saveBtn.querySelector('span').textContent = 'Сохранить в контакты';
    }, 3000);
  });

  // Звёзды в движении + падающие звёзды
  (() => {
    const cvs = document.getElementById('stars');
    const ctx = cvs.getContext('2d');
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const colors = ['255,255,255', '255,236,190', '255,214,150'];
    let w, h, dpr, stars = [], meteors = [];
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = innerWidth || document.documentElement.clientWidth; h = innerHeight || document.documentElement.clientHeight;
      if (!w || !h) return;
      cvs.width = w * dpr; cvs.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.min(Math.round(w * h / 3000), 600);
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        r: Math.random() * 1.8 + .6,
        z: Math.random() * .8 + .2,            // глубина: дальние медленнее
        tw: Math.random() * Math.PI * 2,       // фаза мерцания
        c: colors[Math.random() * colors.length | 0]
      }));
    }
    function spawnMeteor() {
      meteors.push({ x: Math.random() * w * .8 + w * .2, y: Math.random() * h * .4, len: 120 + Math.random() * 80, v: 9 + Math.random() * 5, life: 1 });
    }
    function frame() {
      if ((innerWidth && innerWidth !== w) || (innerHeight && innerHeight !== h)) resize();
      ctx.clearRect(0, 0, w, h);
      for (const s of stars) {
        if (!still) {
          s.y -= s.z * .6; s.x += s.z * .15;
          if (s.y < -2) { s.y = h + 2; s.x = Math.random() * w; }
          if (s.x > w + 2) s.x = -2;
          s.tw += .02 + s.z * .03;
        }
        const a = (.6 + Math.sin(s.tw) * .4) * (.45 + s.z * .55);
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${s.c},${a})`;
        if (s.r > 1.6) { ctx.shadowBlur = 10; ctx.shadowColor = `rgba(${s.c},.9)`; } else ctx.shadowBlur = 0;
        ctx.fill();
      }
      ctx.shadowBlur = 0;
      if (!still && Math.random() < .012) spawnMeteor();
      meteors = meteors.filter(m => m.life > 0);
      for (const m of meteors) {
        m.x -= m.v; m.y += m.v * .5; m.life -= .012;
        const g = ctx.createLinearGradient(m.x, m.y, m.x + m.len, m.y - m.len * .5);
        g.addColorStop(0, `rgba(255,236,190,${m.life})`);
        g.addColorStop(1, 'rgba(255,236,190,0)');
        ctx.strokeStyle = g; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x + m.len, m.y - m.len * .5); ctx.stroke();
      }
      if (!still) requestAnimationFrame(frame);
    }
    addEventListener('resize', resize);
    resize(); frame();
  })();

  // Ripple-эффект на кнопке
  const cta = document.getElementById('cta');
  cta.addEventListener('pointerdown', e => {
    const r = cta.getBoundingClientRect();
    const size = Math.max(r.width, r.height);
    const s = document.createElement('span');
    s.className = 'ripple';
    s.style.width = s.style.height = size + 'px';
    s.style.left = (e.clientX - r.left - size / 2) + 'px';
    s.style.top = (e.clientY - r.top - size / 2) + 'px';
    cta.appendChild(s);
    setTimeout(() => s.remove(), 650);
  });

  // 3D-наклон карточки и подсветка за курсором (только для мыши)
  const card = document.getElementById('card');
  const spot = document.getElementById('spot');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (matchMedia('(hover: hover) and (pointer: fine)').matches && !reduced) {
    document.addEventListener('mousemove', e => {
      spot.style.opacity = 1;
      spot.style.left = e.clientX + 'px';
      spot.style.top = e.clientY + 'px';
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - .5;
      const y = (e.clientY - r.top) / r.height - .5;
      if (Math.abs(x) < .8 && Math.abs(y) < .8) {
        card.style.transform = `perspective(1000px) rotateY(${x * 6}deg) rotateX(${-y * 6}deg)`;
      } else {
        card.style.transform = '';
      }
    });
    document.addEventListener('mouseleave', () => {
      card.style.transform = '';
      spot.style.opacity = 0;
    });
  }
</script>
</body>
</html>
